<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="title">Humphrey Myles C. Lozano</h1>
        <p class="tagline">Aspiring IT Specialist | Pixel Artist</p>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link" href="#aboutme">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#education">Education</a></li>
          <li class="nav-item"><a class="nav-link" href="#skillset">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>

        </ul>
      </nav>
    </aside>
    <div class="sidebar-scrim" data-sidebar-close></div>

    <div class="content">
      <button class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="hamburger" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="sr-only">Menu</span>
      </button>

      <main>
        <div id="section-container" class="section-container" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="image-modal" id="image-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="image-modal__backdrop" data-modal-close></div>
    <div class="image-modal__content" role="document">
      <button class="image-modal__nav image-modal__nav--prev" type="button" aria-label="Previous image">
        &#10094;
      </button>
      <button class="image-modal__nav image-modal__nav--next" type="button" aria-label="Next image">
        &#10095;
      </button>
      <button class="image-modal__close" type="button" aria-label="Close image" data-modal-close>
        &times;
      </button>
      <img class="image-modal__img" src="" alt="">
      <p class="image-modal__caption"></p>
    </div>
  </div>

  <script src="js/scripts.js"></script>
  <script src="https://kit.fontawesome.com/25210a6e03.js" crossorigin="anonymous"></script>
